<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление — Сваё, Роднае</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #FBF6EC 0%, #E8F5E9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .redirect-container {
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #4A8C3F;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 28px;
            margin-bottom: 16px;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #E07B39;
            border-top-color: #4A8C3F;
            border-radius: 50%;
            margin: 30px auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #E5E7EB;
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4A8C3F, #E07B39);
            animation: fill 5s linear forwards;
            border-radius: 3px;
        }
        @keyframes fill {
            to { width: 100%; }
        }
        .countdown {
            font-size: 48px;
            font-weight: 700;
            color: #4A8C3F;
            margin: 20px 0;
        }
        .btn-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #4A8C3F;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            transition: transform 0.2s;
        }
        .btn-link:hover {
            transform: translateY(-2px);
            background: #2E5E2E;
        }
        .info-text {
            color: #6B7280;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <h1>⏳ Перенаправление...</h1>
        <p>Вы будете автоматически перенаправлены на главную страницу</p>
        <p><strong>«Сваё, Роднае»</strong></p>

        <div class="spinner"></div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <div class="countdown" id="countdown">5</div>

        <a href="index.html" class="btn-link">Перейти сейчас →</a>
        <p class="info-text">Если перенаправление не происходит, нажмите на ссылку выше</p>
    </div>

    <script>
        let seconds = 5;
        const countdownEl = document.getElementById('countdown');

        const timer = setInterval(() => {
            seconds--;
            if (countdownEl) countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = "index.html";
            }
        }, 1000);

        setTimeout(() => {
            window.location.href = "index.html";
        }, 5000);
    </script>
</body>
</html>
